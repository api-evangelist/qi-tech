components:
  schemas:
    PostDeviceScanTokenRequest:
      type: object
      properties:
        session_id:
          type: string
    PostDeviceScanTokenResponse:
      type: object
      properties:
        token:
          type: string
    GetFaceRecognitionImageImagekeyResponse:
      type: object
      properties:
        image_key:
          type: string
        file_size:
          type: integer
        width_px:
          type: integer
        height_px:
          type: integer
        created_at:
          type: string
    GetFaceRecognitionRegistrationDocumentNumberDocumentnumberRe:
      type: object
      properties:
        registration_key:
          type: string
          description: Chave do registro do rosto
    GetFaceRecognitionRegistrationRegistrationkeyResponse:
      type: object
      properties:
        registration_key:
          type: string
          description: Chave do registro do rosto
    PostLimitsPixAccountRequest:
      type: object
      properties:
        account_id:
          type: string
          description: Identificador único da conta. É essencial que este número seja único para cada requisição
        registration_date:
          type: string
          description: Data e hora do cadastro (ISO 8601)
        limit:
          type: object
          description: Objeto do tipo limit contendo withdraw, change, transaction_natural_person e transaction_legal_person
      required:
      - account_id
      - registration_date
      - limit
    PostLimitsPixAccountAccountidLimitUpdateRequestRequest:
      type: object
      properties:
        withdraw:
          type: object
          description: Limites para modalidade PIX Saque
        change:
          type: object
          description: Limites para modalidade PIX Troco
        transaction_natural_person:
          type: object
          description: Limites para modalidade PIX transacional para pessoas físicas
        transaction_legal_person:
          type: object
          description: Limites para modalidade PIX transacional para pessoas jurídicas
    PostLimitsPixAccountAccountidLimitUpdateRequestResponse:
      type: object
      properties:
        limit_update_requests:
          type: array
          description: Lista com todas as modificações realizadas
        limit_update_request_id:
          type: string
          description: Identificador único da Proposta de Modificação de Limite
        analysis_status:
          type: string
          description: Enumerador do analysis_status da proposta
        client_notification_status:
          type: string
          description: Enumerador do client_notification_status da proposta
        limit_update_request_status:
          type: string
          description: Enumerador do limit_update_request_status da proposta
        limit_update_request_type:
          type: string
          description: Enumerador do limit_update_request_type da proposta
        event_date:
          type: string
          description: Data e hora da criação da Proposta de Modificação de Limite (ISO 8601)
    PostLimitsPixAccountAccountidRecipientListRequest:
      type: object
      properties:
        limit:
          type: object
          description: Object containing transaction limit details with daytime and nighttime periods
      required:
      - limit
    PostLimitsPixAccountAccountidRecipientListResponse:
      type: object
      properties:
        event_date:
          type: string
          description: Date and time of recipient list creation
    PostLimitsPixAccountAccountidRecipientListLimitUpdateRequest:
      type: object
      properties:
        limit:
          type: object
          description: Object containing updated transaction limit details with daytime and nighttime periods
      required:
      - limit
    PostLimitsPixAccountAccountidRecipientListLimitUpdateRequest2:
      type: object
      properties:
        recipient_list_limit_update_requests:
          type: array
          description: List of all modifications made, separated by period
    PostLimitsPixAccountAccountidRecipientListRecipientRequest:
      type: object
      properties:
        document_number:
          type: string
          description: Document number of the recipient to be added
      required:
      - document_number
    PostLimitsPixAccountAccountidRecipientListRecipientResponse:
      type: object
      properties:
        recipient_id:
          type: string
          description: Unique identifier of the recipient
        analysis_status:
          type: string
          description: Enumerator of the analysis status of the proposal
        client_notification_status:
          type: string
          description: Enumerator of the client notification status of the proposal
        recipient_status:
          type: string
          description: Enumerator of the recipient status of the proposal
        event_date:
          type: string
          description: Date and time of recipient creation
    GetOcrImageImagekeyFileResponse:
      type: object
      properties:
        file:
          type: string
          description: A imagem do documento enviada
    PostOnboardingLegalPersonRequest:
      type: object
      properties:
        id:
          type: string
        registration_date:
          type: string
        document_number:
          type: string
        legal_name:
          type: string
        source:
          type: object
        documents:
          type: object
        legal_representatives:
          type: array
    PostOnboardingNaturalPersonRequest:
      type: object
      properties:
        id:
          type: string
        registration_date:
          type: string
        document_number:
          type: string
        name:
          type: string
        source:
          type: object
        face:
          type: object
        documents:
          type: object
    PutOnboardingTipoIdRequest:
      type: object
      properties:
        client_status:
          type: string
      required:
      - client_status
    PostTestApikeyRequest:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    PostTestApikeyResponse:
      type: object
      properties:
        name:
          type: string
        success:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
