aid: qi-tech

name: QI Tech

description: 'QI Tech (legal entity on its docs: QI Sociedade de Crédito Direto S.A.) is a Brazilian financial-infrastructure company offering
  regulated APIs to build financial products: Lending as a Service (debt issuance, simulation, formalization, payroll-deductible credit), Banking
  as a Service (digital accounts, Pix, TED, boletos, escrow accounts), Risk Solutions (KYC, onboarding, antifraud, credit analysis, SCR) and investment
  fund administration and custody (FIDC, DTVM). Its developer documentation at docs.qitech.com.br covers API key exchange, authentication, webhooks
  and an API playground.'

